name: loader-release

# Builds the launcher for the three desktop platforms on GITHUB-HOSTED runners
# and puts it on the release for this tag. The engine is built separately, by
# engine-release.yml, on machines that have the game dump - see that file.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish into (e.g. v0.1.0)"
        required: true
      publish:
        description: "Publish the draft when the build succeeds"
        type: boolean
        default: false
      allow_partial:
        description: "Publish even if the engine assets are missing"
        type: boolean
        default: false

permissions:
  contents: read

env:
  TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            shell: bash
          - name: windows-x86_64
            os: windows-2025
            shell: 'msys2 {0}'
          - name: macos-arm64
            os: macos-15
            shell: bash
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v5

      # -- Linux: build inside 22.04 --------------------------------------
      # glibc is forward- but not backward-compatible, so building against the
      # runner's own 2.39 would exclude most users. The container floor is
      # glibc 2.35: Ubuntu 22.04, Debian 12, Fedora 37 and newer.
      - name: Build (Linux, in an ubuntu:22.04 container)
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD:/src" -w /src ubuntu:22.04 bash -eux -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends \
              python3 python3-dev python3-venv python3-gi python3-gi-cairo \
              python3-cairo gir1.2-gtk-3.0 libgtk-3-0 libgirepository-1.0-1 \
              gir1.2-glib-2.0 libglib2.0-bin adwaita-icon-theme \
              hicolor-icon-theme librsvg2-common shared-mime-info \
              binutils file ca-certificates curl
            python3 -m venv --system-site-packages /opt/venv
            curl -sS -o /tmp/get-pip.py https://bootstrap.pypa.io/get-pip.py
            /opt/venv/bin/python3 /tmp/get-pip.py -q
            /opt/venv/bin/pip install -q pyinstaller==6.22.2 psutil
            /opt/venv/bin/pyinstaller --noconfirm --clean packaging/skate3loader.spec
            chown -R $(stat -c "%u:%g" /src) dist build
          '

      # -- Windows: MSYS2 UCRT64 -------------------------------------------
      # UCRT64 rather than MINGW64, which was deprecated in March 2026. The
      # -pyinstaller package (NOT -python-pyinstaller) ships a prebuilt mingw
      # bootloader, which is what makes this path work at all.
      - name: MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            zip
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-python-cairo
            mingw-w64-ucrt-x86_64-python-psutil
            mingw-w64-ucrt-x86_64-gtk3
            mingw-w64-ucrt-x86_64-gdk-pixbuf2
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-hicolor-icon-theme
            mingw-w64-ucrt-x86_64-shared-mime-info
            mingw-w64-ucrt-x86_64-gtk-update-icon-cache
            mingw-w64-ucrt-x86_64-pyinstaller
            mingw-w64-ucrt-x86_64-pyinstaller-hooks-contrib

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          export SKATE3_GTK_PREFIX="$MINGW_PREFIX"
          pyinstaller --noconfirm --clean packaging/skate3loader.spec

      # -- macOS: Homebrew, Apple Silicon ----------------------------------
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gtk+3 pygobject3 py3cairo adwaita-icon-theme \
                       hicolor-icon-theme librsvg shared-mime-info gobject-introspection
          # Which python Homebrew built PyGObject against is not ours to guess:
          # a venv on the wrong one cannot see `gi` at all, however many
          # --system-site-packages flags it is given. Ask the formula.
          GI_DIR="$(brew list pygobject3 | grep -m1 '/gi/__init__.py$')"
          PYVER="$(echo "$GI_DIR" | grep -o 'python3\.[0-9]*' | head -1)"
          echo "pygobject3 is built for $PYVER ($GI_DIR)"
          # The interpreter is linked into Homebrew's own bin as python3.X. Do
          # not go via `brew --prefix python3.14` - the FORMULA is python@3.14,
          # and that mismatch is a whole build for nothing.
          PY="$(brew --prefix)/bin/$PYVER"
          test -x "$PY" || PY="$(brew --prefix "python@${PYVER#python}")/bin/$PYVER"
          "$PY" -m venv --system-site-packages .venv
          .venv/bin/pip install -q pyinstaller==6.22.2 psutil
          export SKATE3_GTK_PREFIX="$(brew --prefix)"
          .venv/bin/pyinstaller --noconfirm --clean packaging/skate3loader.spec

      # -- smoke: does the thing we just built actually work? --------------
      # --headless is what gates a release: it needs no display and it is where
      # every real bundling failure shows up (a forgotten typelib, a stale
      # loaders.cache, missing gschemas.compiled, the frozen-path bug).
      - name: Selftest (headless)
        run: |
          case "${{ runner.os }}" in
            macOS) BIN="dist/Skate 3 Level Loader.app/Contents/MacOS/skate3loader" ;;
            *)     BIN="dist/skate3loader/skate3loader" ;;
          esac
          "$BIN" selftest --headless
          "$BIN" list
          "$BIN" doctor || true   # no engine and no game files on a runner

      # --gui needs a display server. Xvfb gives Linux a real X11 one, which is
      # also what the loading screen expects; on Windows and macOS whether a
      # hosted runner grants a window station is not something to gate on.
      - name: Selftest (gui, Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb
          xvfb-run -a dist/skate3loader/skate3loader selftest --gui

      - name: Selftest (gui, non-gating)
        if: runner.os != 'Linux'
        continue-on-error: true
        run: |
          case "${{ runner.os }}" in
            macOS) BIN="dist/Skate 3 Level Loader.app/Contents/MacOS/skate3loader" ;;
            *)     BIN="dist/skate3loader/skate3loader" ;;
          esac
          "$BIN" selftest --gui

      # -- archive ---------------------------------------------------------
      - name: Archive (Linux)
        if: runner.os == 'Linux'
        run: tar -C dist -czf "skate3loader-${TAG#v}-${{ matrix.name }}.tar.gz" skate3loader

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        run: |
          cd dist && zip -qr "../skate3loader-${TAG#v}-${{ matrix.name }}.zip" skate3loader

      - name: Archive (macOS)
        if: runner.os == 'macOS'
        # ditto, never `zip -r`: PyInstaller 6 cross-links Contents/Frameworks
        # and Contents/Resources with symlinks, and zip flattens them, after
        # which the app will not launch.
        run: |
          codesign --force --deep --sign - "dist/Skate 3 Level Loader.app"
          codesign --verify --deep --strict "dist/Skate 3 Level Loader.app"
          ditto -c -k --keepParent "dist/Skate 3 Level Loader.app" \
                "skate3loader-${TAG#v}-${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: loader-${{ matrix.name }}
          path: skate3loader-*.*
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: The tag must agree with the source
        run: |
          VERSION="$(python3 -c 'import re,pathlib; print(re.search(r"\"(.*)\"", pathlib.Path("loader/_version.py").read_text()).group(1))')"
          test "v$VERSION" = "$TAG" || {
            echo "tag $TAG does not match loader/_version.py ($VERSION)" >&2
            exit 1
          }

      - name: Upload the loader assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "$TAG" --notes ""
          gh release upload "$TAG" assets/skate3loader-* --clobber

      - name: Checksums over everything on the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # One machine, one tool, one format - reconciling sha256sum, shasum and
        # certutil across three OSes is not worth the trouble.
        run: |
          mkdir -p all && cd all
          gh release download "$TAG" --pattern '*' --clobber
          rm -f SHA256SUMS
          sha256sum * > SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber
          cat SHA256SUMS

      - name: Publish
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COUNT=$(gh release view "$TAG" --json assets --jq '.assets | length')
          # 3 loader + 3 engine + SHA256SUMS. A release missing the engine is
          # usually a machine that was asleep, not a decision.
          if [ "$COUNT" -lt 7 ] && [ "${{ inputs.allow_partial }}" != "true" ]; then
            echo "only $COUNT assets on $TAG; engine builds are probably missing." >&2
            echo "Re-run with allow_partial=true to publish anyway." >&2
            exit 1
          fi
          gh release edit "$TAG" --draft=false
